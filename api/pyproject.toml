[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airport-investment-intelligence-api"
version = "1.0.0"
description = "API for evidence-based airport investment analysis"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "certifi>=2025.1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "PyJWT[crypto]>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8,<10",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
airport-admin = "app.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["I001", "UP007", "UP035"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["alembic/"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
